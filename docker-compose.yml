services:
  db:
    image: postgres:16-alpine
    container_name: tabular-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tabular
      POSTGRES_PASSWORD: tabular
      POSTGRES_DB: tabular
    ports:
      - "5432:5432"
    volumes:
      - tabular-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabular -d tabular"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tabular-pgdata:
